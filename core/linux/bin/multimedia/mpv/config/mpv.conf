# 필수 --------------------------------------------------------------------------
# 창 시작 크기를 모니터 해상도의 50%로 설정
autofit=50%

# 또는 고정 해상도로 지정하고 싶다면 아래 주석(#)을 해제
# geometry=1024x576

# 창 크기를 임의로 조절할 수 있도록 허용
keep-open=yes

volume="70"
# ------------------------------------------------------------------------------


# 하드웨어 가속 -------------------------------------------------------------------
# GPU 안에서 모든 것을 처리하는 방식(Native)인데, 구형 하드웨어에서는 가끔 화면 출력(VO)과 충돌
# GPU 메모리 안에서만 데이터를 돌리는데, Seek 시 쓰레기 데이터가 남으면 그걸 그대로 화면에 뿌립니다.
# 사용
# hwdec=vaapi

# GPU가 압축만 풀고 화면에 뿌리는 건 다시 시스템 메모리를 거치게 하여 안정성을 높입니다.
# CPU 점유율이 2~3% 정도 아주 미세하게 오를 수 있지만, 녹색 깨짐 현상을 잡는 데 매우 효과적
# GPU가 디코딩한 데이터를 램(RAM)으로 한 번 복사해서 정제한 뒤 화면에 뿌립니다. 이 과정에서 깨진 데이터가 걸러집니다.
# 사용
# hwdec=vaapi-copy

# 하드웨어 가속 끄기 (seek 녹색화면 문제 해결용)
# 선택
# hwdec=no

# 구형pc에 최적화된 코덱 및 해상도 설정 (구형pc는 av1 불가, h.264 우선)
# 사용
# 최대 해상도 1080p 이하로 제한
# ytdl-format="bestvideo[height<=?1080][vcodec^=avc1]+bestaudio/best"
# 최대 해상도 720p 이하로 제한
# ytdl-format="bestvideo[height<=?720][vcodec^=avc1]+bestaudio/best"
# 최대 해상도 480p 이하로 제한
ytdl-format="bestvideo[height<=?480][vcodec^=avc1]+bestaudio/best"
# 최대 해상도 240p 이하로 제한
# ytdl-format="bestvideo[height<=?240][vcodec^=avc1]+bestaudio/best"
# ------------------------------------------------------------------------------


# 비디오 출력 드라이버(vo) 변경 ------------------------------------------------------
# 화면 출력 방식 (가장 가벼운 설정 중 하나)
# 사용
# vo=gpu

# GPU 가속과 출력을 하나로 통합합니다. 가장 가볍지만 호환성을 탄다.
# (애러가 난다.>> 사용안한다.)
# vo=vaapi

# (X11 환경이라면) 가장 원시적이고 가벼운 출력 방식입니다. 화려한 효과는 없지만 녹색 깨짐에는 강하다
# (애러가 난다.>> 사용안한다.)
# vo=x11
# ------------------------------------------------------------------------------


# 하드웨어 가속 초기화 문제 해결1 (Seek 시 녹색화면 발생) --------------------------------
# Seek을 할 때 녹색 화면이 잠깐 나왔다 사라진다면, 이전 프레임의 잔상이 남아서 생기는 문제

# Seek 직후 화면이 깨지면 즉시 디코딩 버퍼를 비움
# 사용
vd-lavc-fast=yes

# 하드웨어 가속 시 프레임 드랍 발생 시 처리 방식 개선
# 사용
framedrop=vo

# CPU가 순간적으로 밀려도 싱크를 맞추기 위해 노력합니다.
# (애러가 난다.>> 사용안한다.)
# --framedrop=yes
# ------------------------------------------------------------------------------


# 하드웨어 가속 초기화 문제 해결2 (Seek 시 녹색화면 발생) --------------------------------
# Seek 직후에 깨진 화면을 붙잡고 있지 말고, "무조건 다음 깨끗한 화면(키프레임)부터 시작해라"라고 명령하는 설정

# 하드웨어 디코딩 시 손상된 프레임은 과감히 버림
# 사용
hwdec-codecs=all

# 디코딩 에러가 발생한 프레임을 화면에 출력하지 않음
# 사용
vd-lavc-skiploopfilter=all

# 영상 싱크를 맞추기 위한 설정
# 사용
video-sync=display-resample
# ------------------------------------------------------------------------------


# mpv가 데이터를 미리 왕창 받아두게 하면 Seek 시 기다림이 없다. ---------------------------
# 캐시 메모리 크기 (램 8GB이시니 넉넉히 500MB 정도 할당)
# 사용
# cache=yes
# demuxer-max-bytes=500MiB
# demuxer-max-back-bytes=200MiB

# 인터넷이 빠르다면 미리 읽어오는 양을 늘림
# 사용
# cache-secs=300
# ------------------------------------------------------------------------------


# 스트리밍 시 Seek 속도를 높여주는 옵션 -----------------------------------------------
# Seek 시 비디오 출력을 다시 초기화하지 않고 부드럽게 연결
# shift + 방향키로 seek를 사용
# 사용
hr-seek=no

# 네트워크 스트리밍 시 읽기 속도 최적화
# 사용
# tls-ca-file=/etc/ssl/certs/ca-certificates.crt
# ------------------------------------------------------------------------------


# web-browser cookies 사용하기 ---------------------------------------------------
# firefox cookies 사용하기
# --ytdl-raw-options=cookies-from-browser=firefox

# chrome cookies 사용하기
# --ytdl-raw-options=cookies-from-browser=chrome

# chrome cookies를 임시 경로를 지정한다.(애러방지)
# --ytdl-raw-options="cookies-from-browser=chrome+~/.config/google-chrome"
# ------------------------------------------------------------------------------
